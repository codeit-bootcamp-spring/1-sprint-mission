services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
        PROJECT_VERSION: ${PROJECT_VERSION}
        JVM_OPTS: ${JVM_OPTS}
    env_file:
      - .env
    ports:
      - "8081:8080"
    volumes:
      - ./data/binaryContent:/app/data/binaryContent
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "discodeit_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: