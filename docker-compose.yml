version: '3'

# 공통 환경변수 정의
x-app-environment: &app-env
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  STORAGE_TYPE: ${STORAGE_TYPE}
  STORAGE_LOCAL_ROOT_PATH: ${STORAGE_LOCAL_ROOT_PATH}
  AWS_S3_REGION: ${AWS_S3_REGION}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET}
  AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
  AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
  AWS_S3_PRESIGNED_URL_EXPIRATION: ${AWS_S3_PRESIGNED_URL_EXPIRATION}
  DISCODEIT_ADMIN_USERNAME: ${DISCODEIT_ADMIN_USERNAME}
  DISCODEIT_ADMIN_EMAIL: ${DISCODEIT_ADMIN_EMAIL}
  DISCODEIT_ADMIN_PASSWORD: ${DISCODEIT_ADMIN_PASSWORD}
  SECURITY_REMEMBER_ME_KEY: ${SECURITY_REMEMBER_ME_KEY}
  SECURITY_REMEMBER_ME_TOKEN_VALIDITY_SECONDS: ${SECURITY_REMEMBER_ME_TOKEN_VALIDITY_SECONDS}
  JWT_SECRET: ${JWT_SECRET}
  SECURITY_JWT_ACCESS_TOKEN_VALIDITY_SECONDS: ${SECURITY_JWT_ACCESS_TOKEN_VALIDITY_SECONDS}
  SECURITY_JWT_REFRESH_TOKEN_VALIDITY_SECONDS: ${SECURITY_JWT_REFRESH_TOKEN_VALIDITY_SECONDS}
  KAFKA_BOOTSTRAP_SERVERS: broker:29092
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_PORT}

services:
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro  # 프론트엔드 빌드 결과 마운트
    depends_on:
      - backend1
    #      - backend2
    #      - backend3
    networks:
      - discodeit-network

  backend1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend1
    environment:
      <<: *app-env
      SERVER_ID: backend1
    volumes:
      - binary-content-storage:/app/.discodeit/storage
    depends_on:
      - db
    networks:
      - discodeit-network

  #  backend2:
  #    build:
  #      context: .
  #      dockerfile: Dockerfile
  #    container_name: backend2
  #    environment:
  #      <<: *app-env
  #      SERVER_ID: backend2
  #    volumes:
  #      - binary-content-storage:/app/.discodeit/storage
  #    depends_on:
  #      - db
  #    networks:
  #      - discodeit-network
  #
  #  backend3:
  #    build:
  #      context: .
  #      dockerfile: Dockerfile
  #    container_name: backend3
  #    environment:
  #      <<: *app-env
  #      SERVER_ID: backend3
  #    volumes:
  #      - binary-content-storage:/app/.discodeit/storage
  #    depends_on:
  #      - db
  #    networks:
  #      - discodeit-network

  db:
    image: postgres:17
    container_name: discodeit-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/schema.sql:/docker-entrypoint-initdb.d/schema.sql # 초기 스키마 자동 실행하기
    networks:
      - discodeit-network

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - discodeit-network

  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - discodeit-network

volumes:
  postgres-data:
  binary-content-storage:
  redis-data:

networks:
  discodeit-network:
    driver: bridge
