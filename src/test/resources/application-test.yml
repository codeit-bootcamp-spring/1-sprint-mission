# TEST

spring:
  config:
    import: optional:file:.env.test.properties
  datasource:
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # sql initialize를 사용하지 않을 것
  sql:
    init:
      mode: embedded

discodeit:
  storage:
    type:
      ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:temp}
    s3:
      access-key-id: ${AWS_ACCESS_KEY_ID}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}
    admin:
      username: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}
      email: ${ADMIN_EMAIL}
    cookie:
      persistent-key: ${PERSISTENT_COOKIE_KEY}
    jwt:
      secret: ${JWT_SECRET_KEY}
      access-token-expiration: 900000     # 15min
      refresh-token-expiration: 604800000   # 7day
  security:
    csrf:
      cookie:
        secure: false

# 테스트용이기에 DEBUG로 확인
logging:
  level:
    root: debug
    com.sprint.mission.discodeit: debug
    org:
      hibernate:
        sql: debug
        type:
          descriptor:
            sql: debug