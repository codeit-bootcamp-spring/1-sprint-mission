server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
  jpa:
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        show_sql: true
        format_sql: true

logging:
  file:
    path: ./logs
    name: app-dev
  logback:
    rollingpolicy:
      max-history: 30
  level:
    root: info
    org.springframework.security: DEBUG