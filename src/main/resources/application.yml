server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  application:
    name: discodeit
  profiles:
    active: dev # 로컬환경은 dev 배포환경은 prod
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
logging:
  level:
    root: info # 기본 로깅 레벨
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

discodeit:
  storage:
    type: local
    local:
      root-path: ${user.dir}/uploads

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Discodeit
    version: 1.7.0
  java:
    version: 17
  spring:
    boot:
      version: 3.4.0
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    driver-class-name: org.postgresql.Driver
  jpa:
    ddl-auto: none
  storage:
    type: local
    path: /data/uploads
  multipart:
    max-file-size: 10MB
    max-request-size: 20MB
