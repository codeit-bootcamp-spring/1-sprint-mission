


spring:
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB # 요청 파일 하나당 허용 사이즈
      max-request-size: 100MB  #multipart/form-data 요청에서 전체 파일의 허용 사이즈
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        #show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  default-consumes-media-type: application/json

discodeit:
  repository:
    type: jcf
    file-directory: .discodeit



logging:
  level:
    com.sprint: TRACE
