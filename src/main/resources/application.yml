server:
  port: 8080

spring:
  application:
    name: discodeit
  profiles:
    active: dev # 로컬환경은 dev 배포환경은 prod
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    root: info # 기본 로깅 레벨
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace


discodeit:
  storage:
    type: local
    local:
      root-path: ${user.dir}/storage
