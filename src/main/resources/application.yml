spring:
  application:
    name: Discodeit
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

storage:
  type: local
  path: /tmp/discodeit/storage

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
    info:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    version: 1.7.0
    description: Discord-like chat application
  java:
    version: ${java.version}
  spring-boot:
    version: ${spring-boot.version}
  config:
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${storage.type}
      path: ${storage.path}
    multipart:
      max-file-size: ${spring.servlet.multipart.max-file-size}
      max-request-size: ${spring.servlet.multipart.max-request-size} 