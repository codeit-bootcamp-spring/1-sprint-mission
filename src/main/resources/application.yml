spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  thymeleaf:
    cache: false
      
  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        #      show_sql: true
        format_sql: true

  springdoc:
    swagger-ui:
      # swagger-ui 접근 경로. default 값은 /swagger-ui.html이다.
      path: //localhost:8080/swagger-ui.html

      # 각 API의 그룹 표시 순서
      # path, query, body, response 순으로 출력
      groups-order: DESC

      # 태그 정렬 순서.
      # alpha: 알파벳 순 정렬
      # method: OpenAPI specification file에 원하는 태그 정렬 방식 직접 기재
      tags-sorter: alpha

      # 컨트롤러 정렬 순서.
      # method는 delete - get - patch - post - put 순으로 정렬된다.
      # alpha를 사용해 알파벳 순으로 정렬할 수 있다.
      operations-sorter: method

      # swagger-ui default url인 petstore html의 비활성화 설정
      disable-swagger-default-url: true

      # swagger-ui에서 try 했을 때 request duration을 알려주는 설정
      display-request-duration: true

    # openAPI 접근 경로. default 값은 /v3/api-docs 이다.
    api-docs:
      path: /api-docs

    # Spring Actuator의 endpoint까지 보여줄 것인지?
    show-actuator: true

    # request media type 의 기본 값
    default-consumes-media-type: application/json

    # response media type 의 기본 값
    default-produces-media-type: application/json

logging:
  level:
    root: info

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}  # local | s3 (기본값: local)
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # (기본값: 10분)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    java:
      enabled: true
    build:
      enabled: true

# 애플리케이션 정보 설정
info:
  app:
    name: ${spring.application.name}
    version: 1.7.0
    description: Discodeit Application
  java:
    version: 17
  spring-boot:
    version: 3.4.0
  config:
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.max-file-size}
      max-request-size: ${spring.servlet.multipart.max-request-size}
