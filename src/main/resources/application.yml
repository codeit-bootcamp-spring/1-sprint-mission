server:
  port: 8080

spring:
  application:
    name: 1-sprint-mission
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

sprint-mission:
  repository:
    type: file
    file-directory: .1-sprint-mission

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha