spring:
  application:
    name: discodeit
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

discodeit:
  repository:
    type: file
    base-directory: user.dir
    file-directory: .discodeit/data/
    extension: .ser
  storage:
    type: local
    local:
      root-path: .discodeit/data


logging:
  level:
    root: INFO
    com.sprint.mission.discodeit: DEBUG
    com.sprint.mission.discodeit.controller: DEBUG
    com.sprint.mission.discodeit.service: DEBUG
    com.sprint.mission.discodeit.repository: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: DEBUG
    javax.management: INFO
    sun.rmi: INFO
