spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    generate_statistics: true
    database: postgresql
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        highlight_sql: true
        use_sql_comments: true
        format_sql: true
logging:
  level:
    root: INFO