spring:
  datasource:
    url: jdbc:h2:mem:devDB
    username: devUser
    password: devPass
    driver-class-name: org.h2.Driver  # 명시적으로 드라이버 클래스 지정
  h2:
    console:
      enabled: true # H2 콘솔 활성화
  sql:
    init:
      mode: always # Spring Boot DB 테이블 만들기
  jpa:
    hibernate:
      ddl-auto: none

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG # Hibernate SQL 쿼리 로그만 DEBUG 활성화

server:
  port: 8080