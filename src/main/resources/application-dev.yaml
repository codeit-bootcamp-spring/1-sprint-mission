server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://discodeit-db.cox0m06o6omr.us-east-1.rds.amazonaws.com:5432/postgres
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true