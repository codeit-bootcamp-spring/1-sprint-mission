spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_PUBLIC_URL}
    username: ${PGUSER}
    password: ${PGPASSWORD}

server:
  port: 8081

logging:
  level:
    root: debug #개발 환경에서는 debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    com.sprint: debug

