server:
  port: 8080

spring:
  application:
    name: discodeit
  sql:
    init:
      mode: never
      schema-locations: classpath:/schema.sql
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    logging:
      level:
        org.hibernate.SQL: DEBUG
        org.hibernate.orm.jdbc.bind: trace

logging:
  level:
    root: info
    com.sprint.mission.discodeit: debug

discodeit:
  storage:
    type: local
    local:
      root-path: ./discodeit/storage

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Discodeit
    version: 1.7.0
    java:
      version: 17
    springboot:
      version: 3.4.0
    datasource:
      url: jdbc:postgresql://localhost:5432/discodeit
      driver-class-name: org.postgresql.Driver
    jpa:
      ddl-auto: none
    storage:
      type: local
      path: ./discodeit/storage
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
