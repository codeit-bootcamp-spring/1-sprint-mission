spring:
  application:
    name: discodeit
  sql:
    init:
      mode: never
      schema-locations: classpath:/schema.sql
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  logging:
    level:
      org.hibernate.SQL: DEBUG

discodeit:
  repository:
    type: jcf
    file-directory: .discodeit

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html