server:
  port: 8080
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  web:
    resources:
      cache:
        period: 0
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG # org : hibernate: sqL: 했을 떈 오류 떴는데 이렇게 하니까 WARM안뜸
discodeit:
  storage:
    type: local
    local:
      root-path: "C:/Users/User/OneDrive/Desktop/codeit/1-sprint-mission/src/main/resources/static"
springdoc:
  packages-to-scan: com.sprint.mission.discodeit.controller
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: alpha
