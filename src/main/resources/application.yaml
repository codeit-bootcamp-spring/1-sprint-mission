spring:
  profiles:
    active: dev

server:
  servlet:
    session:
      timeout: 30m
  error:
    include-stacktrace: never

logbook:
  obfuscate:
    headers: Authorization, Cookie

jwt:
  issuer: demo-api
  access-token:
    validity-seconds: 900  # 15분
  refresh-token:
    validity-seconds: 2592000  # 30일
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}

logging:
  level:
    com.example.jwt: DEBUG

