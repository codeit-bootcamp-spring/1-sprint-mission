spring:
  application:
    name: 1-sprint-mission

  servlet:
    multipart:
      enabled: true
      maxFileSize: 10MB
      maxRequestSize: 30MB

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    generate_statistics: true
    database: postgresql
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        highlight_sql: true # ANSI 코드에 색을 나타낸다
        use_sql_comments: true
        format_sql: true

file:
  path:
    user: data/users.dat
    channel: data/channels.dat
    message: data/messages.dat
    binarycontent: data/binarycontents
    readstatus: data/readstatus.dat
    userstatus: data/userstatus.dat

discodeit:
  repository:
    type: file
  storage:
    type: local
    local:
      root-path: /path/to/storage/directory
