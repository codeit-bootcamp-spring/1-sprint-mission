spring:
  application:
    name: discodeit
  profiles.active: ${ACTIVE:dev}
  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    #        default_batch_fetch_size: 100
    open-in-view: false


logging:
  level:
    root: info
    org.springframework: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/storage

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
        exclude: env
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  info:
    java:
      enabled: true
    env:
      enabled: true

info:
  app:
    name: Discodeit
    version: 1.0.0
    java-version: 17
    spring-boot-version: 3.4.0
  settings:
    datasource:
      url: jdbc:postgresql://localhost:5432/discodeit
      driver-class-name: org.postgresql.Driver
    jpa:
      ddl-auto: update
    storage:
      type: local
      path: /discodeit/storage
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
