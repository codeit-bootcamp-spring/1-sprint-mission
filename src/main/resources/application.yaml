spring:
  application:
    name: discodeit
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 30MB
  profiles:
    active: dev  # 기본 프로파일 (운영 환경에서는 prod로 변경)

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    groups-order: ASC
    enabled: true

discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/storage
