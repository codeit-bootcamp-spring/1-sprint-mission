spring-boot:
  version: 3.4.0

spring:
  profiles:
    active: dev

  application:
    name: discodeit
    version: 1.7.0

  boot:
    admin:
      client:
        instance:
          name: discodeit

  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량

  messages:
    basename: messages, errors
    encoding: UTF-8

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/storage

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
      base-path: /management
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    version: ${spring.application.version}
  java:
    version: ${java.version}
  spring-boot:
    version: ${spring-boot.version}
  settings:
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.maxFileSize}
      max-request-size: ${spring.servlet.multipart.maxRequestSize}
