spring:
  application:
    name: discodeit
  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver  # PostgreSQL 드라이버 클래스
    hikari:
      maximum-pool-size: 10  # 최대 커넥션 풀 크기
  jpa:
    hibernate:
      ddl-auto: update  # Hibernate가 자동으로 스키마를 업데이트하도록 설정
    show-sql: true  # SQL 쿼리 로그 출력
    properties:
      hibernate:
        format_sql: true  # SQL 쿼리 출력 시 보기 좋게 포맷팅
  logging:
    level:
      org.hibernate.SQL: DEBUG  # Hibernate SQL 로그를 출력하기 위한 설정
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # PreparedStatement 바인딩 값 로그 출력

discodeit:
  repository:
    type: file   # jcf | file
    file-directory: .discodeit