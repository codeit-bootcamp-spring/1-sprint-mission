server:
  port: 80

spring:
  application:
    name: discodeit

  jpa:
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB # 파일 하나의 최대 크기
      max-request-size: 20MB # 한 번에 최대 업로드 가능 용량
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}

discodeit:
  storage:
    type: ${STORAGE_TYPE:local} # local|s3 (기본값 : local)
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # 기본값 : 10분


logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include:
          - "health"
          - "info"
          - "metrics"
          - "loggers"
  endpoint:
    health:
      show-details: "ALWAYS"
  info:
    git:
      mode: full # Git 정보를 가져올 수 있도록 설정

info:
  app:
    name: Discodeit
    version: 1.7.0
    java-version: 17
    spring-boot-version: 3.4.0

  datasource:
    url: ${spring.datasource.url}
    driver-class-name: ${spring.datasource.driver-class-name}


springdoc:
  packages-to-scan: com.sprint.mission.discodeit.controller
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: alpha