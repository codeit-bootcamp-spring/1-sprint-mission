spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    show_sql: true
    hibernate:
      ddl-auto: create
      format_sql: true
      default_batch_fetch_size: 1000
      #generate_statistics: true;
    open-in-view: false

  application:
    name: discodeit
  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  info:
    title: "Discodeit API 문서"
    description: "Discodeit 프로젝트의 Swagger API 문서입니다."
    version: "1.0.0"
  servers:
    - url: "http://localhost:8080"
      description: "로컬 서버"

path: /discodeit/api-docs

discodeit:
  storage:
    type: local
    local:
      root-path: C:\Users\ypd06\OneDrive\desktop\1-sprint-mission\src\main\java\com\sprint\mission/1-sprint-mission/data_storage/
