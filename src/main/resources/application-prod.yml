spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB # 요청 파일 하나당 허용 사이즈
      max-request-size: 50MB  #multipart/form-data 요청에서 전체 파일의 허용 사이즈
  threads:
    virtual:
      enabled: true
---
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:discodeit}
    username: ${DB_USERNAME:discodeit_user}
    password: ${DB_PASSWORD:discodeit1234}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

discodeit:
  storage:
    type: local
    local.root-path : "C:\\binary-storage"
    # 호스트 환경에?
logging:
  level:
    org.hibernate.sql : warn

