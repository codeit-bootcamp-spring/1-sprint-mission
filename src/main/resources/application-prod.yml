spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB # 요청 파일 하나당 허용 사이즈
      max-request-size: 50MB  #multipart/form-data 요청에서 전체 파일의 허용 사이즈
  threads:
    virtual:
      enabled: true
---
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always  # 애플리케이션 실행 시 항상 schema.sql 실행
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  default-consumes-media-type: application/json

discodeit:
  storage:
    type: local
    local.root-path : "C:\\binary-storage"
    #repository:
    #type: jcf
    #file-directory: .discodeit

logging:
  level:
    org.hibernate.sql : warn

