spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB # 요청 파일 하나당 허용 사이즈
      max-request-size: 50MB  #multipart/form-data 요청에서 전체 파일의 허용 사이즈
---
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:discodeit}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}
    local.root-path : ${DISCODEIT_STORAGE:"var/discodeit-storage/"}

logging:
  level:
    org.hibernate.sql : warn

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

