server:
  port: 80

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false

logging:
  file:
    path: ./logs
    name: app-prod
  logback:
    rollingpolicy:
      max-history: 30
  level:
    root: info

discodeit:
  storage:
    type: local
    local:
      root-path: ./binaryContents

management:
  endpoints:
    web:
      exposure:
        include:
          - "health"
          - "info"
          - "metrics"
          - "loggers"
  endpoint:
    health:
      show-details: "ALWAYS"
  info:
    env:
      enabled: true

info:
  name: ${spring.application.name}
  version: ${spring.application.version}
  java:
    version: ${java.version}
  spring-boot:
    version: ${spring.boot.version}
  profile: ${spring.profiles.active}