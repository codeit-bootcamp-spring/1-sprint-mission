server:
  port: 80

spring:
  application:
    name: discodeit
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_CLIENT_URL}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${USER_NAME}
    password: ${PASSWORD}

# Logging
logging:
  level:
    com.sprint.mission.discodeit: info
