spring:
  application:
    name: discodeit
  sql:
    init:
      mode: never
      schema-locations: classpath:/schema.sql
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

discodeit:
  storage:
    type: local
    local:
      root-path: ./discodeit/storage

springdoc:
  api-docs:
    enabled: false
    swagger-ui:
      enabled: false