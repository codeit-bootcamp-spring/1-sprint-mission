server:
  port: 80

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: false # Hibernate SQL 로그를 예쁘게 출력할지 여부
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_CLIENT_URL} #Spring Boot Admin 서버 URL을 설정하는 항목
logging:
  level:
    com.sprint.mission.discodeit: info
    org.hibernate.SQL: info

management:
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false