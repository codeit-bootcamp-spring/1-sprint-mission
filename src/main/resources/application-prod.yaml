server:
  port: 80

spring:
  datasource:
    url: jdbc:postgresql://prod-db:5432/discodeit_prod
    username: prod_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: info
    com.sprint.mission.discodeit: info
    org.hibernate.SQL: info

discodeit:
  storage:
    type: s3
    s3:
      bucket-name: discodeit-prod 