spring:
  application:
    name: discodeit
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

discodeit:
  repository:
    type: file
    base-directory: user.dir
    file-directory: .discodeit/data/
    extension: .ser
  storage:
    type: ${STORAGE_TYPE}
    local:
      root-path: .discodeit/data

cloud:
  aws:
    region:
      static: ${AWS_S3_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_S3_ACCESS_KEY:#{null}}
      secret-key: ${AWS_S3_SECRET_KEY:#{null}}
    s3:
      bucket: ${AWS_S3_BUCKET}


logging:
  level:
    root: INFO
    com.sprint.mission.discodeit: INFO
    com.sprint.mission.discodeit.controller: INFO
    com.sprint.mission.discodeit.service: INFO
    com.sprint.mission.discodeit.repository: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.springframework.jdbc.core.JdbcTemplate: INFO
    org.springframework.jdbc.core.StatementCreatorUtils: INFO