server:
  port: 80

spring:
  datasource: # 데이터베이스 설정
    driver-class-name: org.postgresql.Driver  # PostgreSQL 데이터베이스 사용
    url: ${SPRING_DATASOURCE_URL} # 연결 URL
    username: ${SPRING_DATASOURCE_USERNAME}  # 사용자
    password: ${SPRING_DATASOURCE_PASSWORD} # 비밀번호
  jpa:
    properties:
      hibernate:
        format_sql: false

logging: # Hibernate SQL 로그 설정
  level:
    com.sprint.mission.discodeit: info
    org.hibernate.SQL: info  # Hibernate가 실행하는 SQL 쿼리를 로그로 출력
