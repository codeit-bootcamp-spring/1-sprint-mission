server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true

logging:
  file:
    path: ./logs
    name: app-dev
  logback:
    rollingpolicy:
      max-history: 30
  level:
    root: info

discodeit:
  storage:
    type: local
    local:
      root-path: ${user.dir}/binaryContents
