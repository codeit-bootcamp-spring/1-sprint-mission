server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234

  jpa:
    hibernate:
      ddl_auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true  # SQL을 보기 좋게 정렬
        dialect: org.hibernate.dialect.PostgreSQLDialect  # PostgreSQL 최적화

logging:
  level:
    root: info
    org:
      hibernate:
        SQL: DEBUG
        type: TRACE
    com.discodeit: DEBUG