server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.springframework.security: TRACE

discodeit:
  storage:
    type: local
    local:
      root-path: /Users/byeonheejae/Desktop/Study/codeit/path/1-sprint-mission


jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentEnvironmentOnlyPleaseChangeInProduction}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}  # 1 hour in seconds
  refresh-token:
    expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}  # 7 days in seconds