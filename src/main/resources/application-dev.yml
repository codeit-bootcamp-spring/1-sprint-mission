server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true

logging:
  file:
    path: ./logs
    name: app-dev
  logback:
    rollingpolicy:
      max-history: 30
  level:
    root: debug

discodeit:
  storage:
    type: local
    local:
      root-path: ./binaryContents

management:
  endpoints:
    web:
      exposure:
        include:
          - "health"
          - "info"
          - "metrics"
          - "loggers"
  endpoint:
    health:
      show-details: "ALWAYS"
  info:
    env:
      enabled: true

info:
  name: ${spring.application.name}
  version: ${spring.application.version}
  java:
    version: ${java.version}
  spring-boot:
    version: ${spring.boot.version}
  profile: ${spring.profiles.active}
  storage:
    type: ${discodeit.storage.type}
    path: ${discodeit.storage.local.root-path}
  jpa:
    ddl-auto: ${spring.jpa.hibernate.ddl-auto}