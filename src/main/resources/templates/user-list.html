<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>유저 목록</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #313338;
            color: #fff;
        }

        .container {
            max-width: 1000px;
            margin: 48px auto;
            padding: 20px;
        }

        h2 {
            margin-bottom: 32px;
            color: #fff;
        }

        .table {
            width: 100%;
            background-color: #2B2D31;
            border-radius: 8px;
            overflow: hidden;
        }

        .thead-light {
            background-color: #1E1F22;
        }

        .table th {
            color: #B5BAC1;
            padding: 16px;
            text-align: left;
        }

        .table td {
            padding: 16px;
            border-bottom: 1px solid #1E1F22;
            color: #B5BAC1;
        }

        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            border: none;
        }

        .btn-danger {
            background-color: #ED4245;
            color: #fff;
        }

        .btn-primary {
            background-color: #5865F2;
            color: #fff;
            margin-right: 8px;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">유저 목록</h2>
    <table class="table table-striped">
        <thead class="thead-light">
        <tr>
            <th>프로필</th>
            <th>이름</th>
            <th>이메일</th>
            <th>상태</th>
            <th>액션</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td>
                <img th:if="${user.profileImage != null && user.profileImage != ''}"
                     th:src="@{'data:image/jpeg;base64,' + ${user.profileImage}}"
                     class="profile-img" alt="Profile Image">
                <span th:if="${user.profileImage == null || user.profileImage == ''}">
        No Image
      </span>
            </td>
            <td th:text="${user.name}">이름</td>
            <td th:text="${user.email}">이메일</td>
            <td th:text="${user.online} ? '온라인' : '오프라인'">상태</td>
            <td>
                <a th:href="@{'/users/delete/' + ${user.id}}" class="btn btn-danger btn-sm">삭제</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/users/register" class="btn btn-primary">회원가입</a>
    <a href="/" class="btn btn-primary">홈</a>
</div>
</body>
</html>
