<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>유저 목록</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        /* 디스코드와 유사한 어두운 테마 */
        body {
            background-color: #36393f;
            color: #dcddde;
        }
        .container {
            margin-top: 20px;
        }
        .table {
            background-color: #2f3136;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #7289da;
        }
        .status-online {
            color: #43b581;
            font-weight: bold;
        }
        .status-offline {
            color: #f04747;
            font-weight: bold;
        }
        .btn-delete {
            color: #f04747;
            background-color: transparent;
            border: none;
        }
        .btn-delete:hover {
            color: #ff6f6f;
        }
        .home-btn {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 홈 버튼 -->
    <div>
        <a class="btn btn-primary home-btn" href="/" role="button">홈</a>
    </div>
    <h1 class="mb-4">유저 목록</h1>
    <table class="table table-dark table-striped">
        <thead>
        <tr>
            <th scope="col">프로필</th>
            <th scope="col">이름</th>
            <th scope="col">이메일</th>
            <th scope="col">상태</th>
            <th scope="col">액션</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td>
                <!-- 프로필 이미지가 있으면 데이터 URL로, 없으면 기본 텍스트 표시 -->
                <img th:if="${user.profileImage != null and user.profileImage != ''}"
                     th:src="@{'data:image/jpeg;base64,' + ${user.profileImage}}"
                     alt="프로필 이미지" class="profile-img"/>
                <span th:if="${user.profileImage == null or user.profileImage == ''}">No Image</span>
            </td>
            <td th:text="${user.name}">이름</td>
            <td th:text="${user.email}">이메일</td>
            <td>
                <span th:if="${user.online}" class="status-online">온라인</span>
                <span th:if="${!user.online}" class="status-offline">오프라인</span>
            </td>

            <td>
                <a th:href="@{'/users/delete/' + ${user.id}}" class="btn btn-delete">삭제</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
