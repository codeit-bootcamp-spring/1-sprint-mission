<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메시지 목록 | Discord Clone</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #36393f;
            color: #dcddde;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .container {
            margin-top: 40px;
        }
        .message {
            background-color: #2f3136;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .sender {
            font-weight: bold;
            color: #ffffff;
        }
        .channel {
            font-size: 12px;
            color: #b9bbbe;
        }
        .content {
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4">메시지 목록</h2>
    <div th:if="${#lists.isEmpty(messages)}">
        <p>전송된 메시지가 없습니다.</p>
    </div>
    <div th:each="msg : ${messages}" class="message">
        <div class="channel" th:text="'채널: ' + ${msg.channelName}">채널 이름</div>
        <div class="sender" th:text="'작성자: ' + ${msg.senderName}">보낸 사람</div>
        <div class="content" th:text="${msg.content}">메시지 내용</div>
        <div class="timestamp" th:text="${#temporals.format(msg.createdAt, 'yyyy-MM-dd HH:mm')}">전송 시간</div>
    </div>
    <a href="/" class="btn btn-link mt-3">홈으로</a>
</div>
</body>
</html>
