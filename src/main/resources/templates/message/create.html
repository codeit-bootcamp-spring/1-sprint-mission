<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메시지 보내기 | Discord Clone</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #36393f;
            color: #dcddde;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .container {
            margin-top: 40px;
        }
        .btn-primary {
            background-color: #5865F2;
            border-color: #5865F2;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4">메시지 보내기</h2>
    <form th:action="@{/messages/create}" th:object="${message}" method="post">
        <div class="form-group">
            <label for="channel">채널 선택</label>
            <select id="channel" th:field="*{channelId}" class="form-control" required>
                <option value="" disabled selected>채널 선택</option>
                <option th:each="channel : ${channels}"
                        th:value="${channel.id}"
                        th:text="${channel.name}"></option>
            </select>
        </div>
        <div class="form-group">
            <select id="sender" th:field="*{senderId}" class="form-control" required>
                <option value="" disabled selected>보낸 사람 선택</option>
                <option th:each="user : ${users}"
                        th:value="${user.id}"
                        th:text="${user.name}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="content">메시지 내용</label>
            <textarea id="content" th:field="*{content}" class="form-control" placeholder="메시지 내용을 입력하세요" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">메시지 전송</button>
    </form>
    <a href="/" class="btn btn-link mt-3">홈으로</a>
</div>
</body>
</html>
