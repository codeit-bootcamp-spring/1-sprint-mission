<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Discord Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #5865F2;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background-color: #313338;
            padding: 32px;
            border-radius: 5px;
            width: 480px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-header h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #B5BAC1;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #B5BAC1;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background-color: #1E1F22;
            border: none;
            border-radius: 3px;
            color: #fff;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border: 1px solid #5865F2;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background-color: #5865F2;
            color: #fff;
            border: none;
            border-radius: 3px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-button:hover {
            background-color: #4752C4;
        }

        .error-message {
            color: #FA777C;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h2>돌아오신 것을 환영합니다!</h2>
        <p>다시 만나서 반가워요!</p>
    </div>
    <form th:action="@{/auth/login}" th:object="${loginRequest}" method="POST">
        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" th:field="*{email}" class="form-control" required>
            <div class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" class="form-control" required>
            <div class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="error-message" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
        <button type="submit" class="login-button">로그인</button>
    </form>
</div>

<script>
    // 에러 메시지 표시 함수
    function showError() {
        document.querySelector('.error-message').style.display = 'block';
    }

    // 폼 제출 처리
    document.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                showError();
                return;
            }

            window.location.href = '/';
        } catch (error) {
            showError();
        }
    });
</script>
</body>
</html>
