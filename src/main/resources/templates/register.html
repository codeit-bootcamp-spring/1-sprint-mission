<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사용자 등록</title>
    <style>
        body { background-color: #36393f; color: #dcddde; font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background-color: #2f3136; padding: 20px; border-radius: 5px; }
        h1 { color: white; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #b9bbbe; }
        input[type="text"], input[type="email"], input[type="password"], input[type="file"] { width: 100%; padding: 8px; background-color: #40444b; border: none; color: white; border-radius: 3px; }
        .btn { padding: 8px 16px; border: none; border-radius: 3px; cursor: pointer; color: white; }
        .btn-primary { background-color: #5865f2; }
        .btn-secondary { background-color: #4f545c; text-decoration: none; display: inline-block; margin-left: 10px; }
        .preview { max-width: 100%; max-height: 200px; margin-top: 10px; border-radius: 5px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>새 사용자 등록</h1>

    <form th:action="@{/users/register}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email">
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password">
        </div>

        <div class="form-group">
            <label for="profileImage">프로필 이미지</label>
            <input type="file" id="profileImage" name="profileImage" accept="image/*" onchange="previewImage(this)">
            <img id="preview" class="preview" alt="이미지 미리보기">
        </div>

        <button type="submit" class="btn btn-primary">등록</button>
        <a href="/users" class="btn btn-secondary">취소</a>
    </form>
</div>

<script>
    function previewImage(input) {
        var preview = document.getElementById('preview');
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.style.display = 'none';
        }
    }
</script>
</body>
</html>
