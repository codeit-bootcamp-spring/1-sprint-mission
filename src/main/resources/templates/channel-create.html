<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채널 생성 | Discord Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #5865F2;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .create-container {
            background-color: #313338;
            padding: 32px;
            border-radius: 5px;
            width: 480px;
        }

        .create-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .create-header h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #B5BAC1;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #1E1F22;
            border: 1px solid #1E1F22;
            border-radius: 3px;
            color: #fff;
            font-size: 16px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #5865F2;
        }

        .create-button {
            width: 100%;
            padding: 12px;
            background-color: #5865F2;
            color: #fff;
            border: none;
            border-radius: 3px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .create-button:hover {
            background-color: #4752C4;
        }
    </style>
</head>
<body>
<div class="create-container">
    <div class="create-header">
        <h2>새로운 채널 만들기</h2>
    </div>
    <form th:action="@{/channels/create}" th:object="${channel}" method="post">
        <div class="form-group">
            <label for="name">채널 이름</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>

        <div class="form-group">
            <label for="description">채널 설명</label>
            <textarea id="description" th:field="*{description}" placeholder="채널의 주제나 규칙을 설명해주세요"></textarea>
        </div>

        <div class="form-group">
            <label for="type">채널 타입</label>
            <select id="type" th:field="*{type}" required>
                <option value="PUBLIC">공개 채널</option>
                <option value="PRIVATE">비공개 채널</option>
            </select>
        </div>

        <div class="form-group">
            <label for="userId">채널 생성자</label>
            <select id="userId" th:field="*{userId}" required>
                <option value="">생성자 선택</option>
                <option th:each="user : ${users}"
                        th:value="${user.id}"
                        th:text="${user.name}">
                </option>
            </select>
        </div>

        <button type="submit" class="create-button">채널 만들기</button>
    </form>
</div>
</body>
</html>
