test {
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true }
}

// --------------------------------------------------
// 6) Clean 태스크에서 생성된 파일들 정리
// --------------------------------------------------
clean {
//    delete querydslDir
    delete 'build'
}

dependencyManagement {
    imports {
        mavenBom "de.codecentric:spring-boot-admin-dependencies:3.4.5"
    }
}