plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.2.1'  // 최신 Spring Boot 버전
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.sprint.mission'
version = '1.0-SNAPSHOT'

application {
    mainClass = 'com.sprint.mission.discodeit.DiscodeitApplication'
}

repositories {
    mavenCentral()
}

dependencies {
    // ✅ Spring Boot Core Dependencies
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'  // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-validation'  // Validation starter
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // ✅ Jackson (JSON 직렬화/역직렬화)
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310' // Java 8+ DateTime 지원

    // ✅ Lombok (컴파일 및 애너테이션 프로세서 설정)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ✅ Swagger/OpenAPI 최신 버전 (Spring Boot 3.x 지원)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // ✅ Jakarta Servlet API
    implementation 'jakarta.servlet:jakarta.servlet-api:5.0.0'

    // ✅ H2 Database (테스트용)
    runtimeOnly 'com.h2database:h2'

    // ✅ Spring Boot Test (JUnit 5 지원)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

java {
    // ✅ JDK 21 사용 (Spring Boot 3.x 이상 지원)
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8'
}

test {
    useJUnitPlatform()
}
