# 메인 리버스 프록시 설정
events {}

http {

  include mime.types;

  server {
    listen 80;
    server_name discodeit;

    location /api {
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
    }

    location /ws {
      proxy_pass http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location / {
      root /etc/nginx/html;
      index index.html;
      try_files $uri /index.html;
    }
  }
}
