name: CD Workflow

on:
  push:
    branches:
      - release

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY_URI }}:latest .
          docker push ${{ secrets.ECR_REPOSITORY_URI }}:latest

      - name: Update ECS task definition and deploy
        run: |
          FAMILY=$(aws ecs describe-task-definition --task-definition ${{ secrets.ECS_TASK_DEFINITION }} --query 'taskDefinition.family' --output text)
          REVISION=$(aws ecs register-task-definition --family $FAMILY --container-definitions "$(cat ecs-task-def.json)" --query 'taskDefinition.revision' --output text)
          aws ecs update-service --cluster ${{ secrets.ECS_CLUSTER }} --service ${{ secrets.ECS_SERVICE }} --task-definition $FAMILY:$REVISION

      - name: Log in to Amazon ECR (Public)
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}

      - name: Build Docker image
        run: |
          IMAGE_TAG=latest
          COMMIT_HASH=$(git rev-parse --short HEAD)
          docker build -t ${{ secrets.ECR_REPOSITORY_URI }}:$IMAGE_TAG -t ${{ secrets.ECR_REPOSITORY_URI }}:$COMMIT_HASH .

      - name: Push Docker image
        run: |
          IMAGE_TAG=latest
          COMMIT_HASH=$(git rev-parse --short HEAD)
          docker push ${{ secrets.ECR_REPOSITORY_URI }}:$IMAGE_TAG
          docker push ${{ secrets.ECR_REPOSITORY_URI }}:$COMMIT_HASH

  update_ecs_service:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Register new task definition
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition ${{ secrets.ECS_TASK_DEFINITION }} --query "taskDefinition" --output json)
          UPDATED_TASK_DEF=$(echo $TASK_DEF | jq '.containerDefinitions[0].image = "${{ secrets.ECR_REPOSITORY_URI }}:latest"')
          UPDATED_TASK_DEF_JSON=$(echo $UPDATED_TASK_DEF | jq '.' > updated-task-definition.json)
          NEW_TASK_DEF=$(aws ecs register-task-definition --cli-input-json file://updated-task-definition.json)
          NEW_TASK_DEF_ARN=$(echo $NEW_TASK_DEF | jq -r '.taskDefinition.taskDefinitionArn')
          echo "New task definition ARN: $NEW_TASK_DEF_ARN"

      - name: Update ECS Service
        run: |
          aws ecs update-service --cluster ${{ secrets.ECS_CLUSTER }} --service ${{ secrets.ECS_SERVICE }} --desired-count 0
          sleep 10  # Optionally, wait before starting new service
          aws ecs update-service --cluster ${{ secrets.ECS_CLUSTER }} --service ${{ secrets.ECS_SERVICE }} --task-definition $NEW_TASK_DEF_ARN --desired-count 1

