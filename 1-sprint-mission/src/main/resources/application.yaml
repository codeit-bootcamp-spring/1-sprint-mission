spring:
  application:
    name: discodeit

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # 개발 중: update, 운영 환경에서는 validate 또는 none 권장
    show-sql: false
    properties:
      hibernate:
        format_sql: true


  sql:
    init:
      mode: always  # 초기 SQL 실행 (필요할 경우 설정)

discodeit:
  storage:

    local:
      root-path: /Users/kbh/storage

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework: info

server:
  port: 8080