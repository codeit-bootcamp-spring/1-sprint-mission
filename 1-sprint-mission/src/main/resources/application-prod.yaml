erver:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://prod-host:5432/discodeit
    username: discodeit_prod
    password: discodeit_prod_1234
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

discodeit:
  storage:
    local:
      root-path: /app/storage