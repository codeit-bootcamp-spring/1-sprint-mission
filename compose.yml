services:
  discodeit-server:
    build: .
    ports:
      - 8080:8080
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: discodeit
      DB_USERNAME: discodeit_user
      DB_PASSWORD: discodeit1234

    depends_on:
      my-db:
        condition: service_healthy

  postgres-db:
    image: postgres
    environment:
      POSTGRES_USER: discodeit_user
      POSTGRES_PASSWORD: discodeit1234
      POSTGRES_DB: discodeit
    volumes:
      - ./discodeit-data:/var/lib/postgresql/data
    ports:
      - 5432:5432

    healthcheck:
        test: ["CMD", "pg_isready", "-U", "discodeit_user"]
        interval: 5s
        retries: 10